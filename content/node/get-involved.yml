          behavior_settings:
            - value: {  }
          revision_translation_affected:
            - value: true
          field_body:
            - value: '<p>Every action you take with Hope Foundation creates a multiplier effect. Your volunteer hours inspire others to serve. Your donations enable us to help more families. Your advocacy amplifies our voice for change.</p><blockquote><p>"The best way to find yourself is to lose yourself in the service of others." - Mahatma Gandhi</p></blockquote><p>Ready to make a difference? Contact our volunteer coordinator at volunteer@hopefoundation.org or call (555) 123-HOPE to get started today.</p>'
              format: full_html
              summary: ''
          field_eyebrow:
