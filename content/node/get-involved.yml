          field_accordion_item:
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: gi-faq-item1-4001-a001-000000000001
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {  }
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>No prior experience is required for most volunteer positions. We provide comprehensive training and ongoing support to ensure you feel confident and prepared. Our volunteer coordinator will match you with opportunities that align with your interests, skills, and availability.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'Do I need experience to volunteer?'
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: gi-faq-item2-4001-a001-000000000002
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {  }
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>We welcome volunteers of all ages and backgrounds. Volunteers under 18 may need parental consent and supervision depending on the activity. Many of our programs offer family-friendly volunteer opportunities where children can participate alongside adults.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'What age groups can volunteer?'
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: gi-faq-item3-4001-a001-000000000003
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {  }
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>Time commitments vary by program. We have opportunities ranging from one-time events (2-4 hours) to regular weekly commitments (2-3 hours per week). We work with your schedule to find meaningful ways for you to contribute based on your availability.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'How much time do I need to commit?'
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: gi-faq-item4-4001-a001-000000000004
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {  }
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>Your donations support our four core program areas: education, healthcare, food security, and environmental action. We also allocate funds for program development, volunteer training, and organizational sustainability. You can view our annual impact report for detailed financial transparency.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'How are donations used?'
